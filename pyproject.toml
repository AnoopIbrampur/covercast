[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covercast"
version = "0.1.0"
description = "Restaurant demand forecasting that is scored on what it costs in labor, not just on forecast error"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Fetching weather from Open-Meteo (covercast.weather).
weather = ["certifi>=2024.2"]
dev = ["pytest>=8.0"]

[project.scripts]
covercast = "covercast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
