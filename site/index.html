<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Covercast Shift Board</title>
<meta name="description" content="Two weeks of restaurant cover forecasts turned into real shifts, replayed against what happened.">
<style>
/* Layout: a translucent toolbar over a grouped page. One headline number, the scrubbable two-week chart, then the selected day as an hourly chart beside inset lists. */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --fill: rgba(120, 120, 128, 0.12);
  --label: #1d1d1f;
  --label-2: rgba(60, 60, 67, 0.62);
  --sep: rgba(60, 60, 67, 0.16);
  --blue: #007aff;
  --blue-soft: rgba(0, 122, 255, 0.2);
  --blue-faint: rgba(0, 122, 255, 0.09);
  --gray: #8e8e93;
  --orange: #ff9500;
  --orange-soft: rgba(255, 149, 0, 0.2);
  --green: #248a3d;
  --bar: rgba(242, 242, 247, 0.72);
  --bar-edge: rgba(0, 0, 0, 0.1);
  --thumb: #ffffff;
  --thumb-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 1px rgba(0, 0, 0, 0.04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --fill: rgba(118, 118, 128, 0.24);
    --label: #f5f5f7; --label-2: rgba(235, 235, 245, 0.62); --sep: rgba(84, 84, 88, 0.55);
    --blue: #0a84ff; --blue-soft: rgba(10, 132, 255, 0.34); --blue-faint: rgba(10, 132, 255, 0.16);
    --gray: #8e8e93; --orange: #ff9f0a; --orange-soft: rgba(255, 159, 10, 0.24); --green: #30d158;
    --bar: rgba(22, 22, 24, 0.72); --bar-edge: rgba(255, 255, 255, 0.1); --thumb: #636366;
    --thumb-shadow: 0 3px 8px rgba(0, 0, 0, 0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fill: rgba(118, 118, 128, 0.24);
  --label: #f5f5f7; --label-2: rgba(235, 235, 245, 0.62); --sep: rgba(84, 84, 88, 0.55);
  --blue: #0a84ff; --blue-soft: rgba(10, 132, 255, 0.34); --blue-faint: rgba(10, 132, 255, 0.16);
  --gray: #8e8e93; --orange: #ff9f0a; --orange-soft: rgba(255, 159, 10, 0.24); --green: #30d158;
  --bar: rgba(22, 22, 24, 0.72); --bar-edge: rgba(255, 255, 255, 0.1); --thumb: #636366;
  --thumb-shadow: 0 3px 8px rgba(0, 0, 0, 0.3); color-scheme: dark;
}
@media (prefers-contrast: more) {
  :root { --label-2: var(--label); --sep: var(--gray); --bar: var(--bg); --bar-edge: var(--gray); }
}
@media (prefers-reduced-transparency: reduce) {
  :root { --bar: var(--bg); }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--label);
  font: 400 1rem/1.47 var(--font); letter-spacing: -0.011em;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* Toolbar: a material layer the page scrolls under. Its edge appears only once content is beneath it. */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bar);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 1px 0 transparent; transition: box-shadow 0.2s ease;
}
.bar.scrolled { box-shadow: 0 1px 0 var(--bar-edge); }
@media (prefers-reduced-transparency: reduce) { .bar { -webkit-backdrop-filter: none; backdrop-filter: none; } }
.bar-inner {
  max-width: 72rem; margin: 0 auto; padding-inline: 1.25rem; padding-block: 0.7rem;
  display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center; justify-content: space-between;
}
.ident { display: flex; align-items: baseline; gap: 0.55rem; min-width: 0; }
.ident b { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.022em; white-space: nowrap; }
.ident span { color: var(--label-2); font-size: 0.8125rem; white-space: nowrap; }
.controls { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }

select {
  appearance: none; -webkit-appearance: none; font: 500 0.875rem/1.2 var(--font); letter-spacing: -0.01em;
  color: var(--label); background-color: var(--fill);
  background-image: linear-gradient(45deg, transparent 50%, var(--label-2) 50%), linear-gradient(135deg, var(--label-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
  border: 0; border-radius: 9px; padding: 0.5rem 1.9rem 0.5rem 0.75rem; max-width: 100%;
  transition: transform 0.1s ease-out;
}
select:active { transform: scale(0.98); }

/* Segmented control. The thumb rides the same spring as the reveal it controls. */
.seg {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--fill);
  border-radius: 9px; padding: 2px; min-width: 15rem; isolation: isolate;
}
.seg .thumb {
  position: absolute; z-index: -1; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px);
  background: var(--thumb); border-radius: 7px; box-shadow: var(--thumb-shadow); will-change: transform;
}
.seg button {
  font: 500 0.8125rem/1 var(--font); letter-spacing: -0.006em; color: var(--label); background: none; border: 0;
  padding: 0.5rem 0.75rem; border-radius: 7px; cursor: pointer; transition: transform 0.1s ease-out, opacity 0.1s ease-out;
  touch-action: manipulation;
}
.seg button:active { transform: scale(0.96); opacity: 0.7; }
.seg button[aria-selected="true"] { font-weight: 600; }
:focus-visible { outline: 3px solid var(--blue-soft); outline-offset: 2px; border-radius: 9px; }

.wrap { max-width: 72rem; margin: 0 auto; padding-inline: 1.25rem; padding-block: 1.75rem 3rem; display: grid; gap: 1.75rem; }

/* Headline: one number, the thing this page exists to answer. */
.hero { display: grid; gap: 0.35rem; }
.eyebrow { margin: 0; color: var(--label-2); font-size: 0.9375rem; letter-spacing: -0.012em; }
.headline { margin: 0; font-size: clamp(2.25rem, 6vw, 3.25rem); line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
.headline .pos { color: var(--green); }
.lede { margin: 0; color: var(--label-2); font-size: 1.0625rem; line-height: 1.42; max-width: 62ch; letter-spacing: -0.016em; }
.chip { display: inline-block; margin-top: 0.35rem; font-size: 0.75rem; font-weight: 500; letter-spacing: 0; color: var(--label-2); background: var(--fill); padding: 0.2rem 0.55rem; border-radius: 99px; justify-self: start; }
.chip.synthetic { color: var(--orange); background: var(--orange-soft); }

.card { background: var(--card); border-radius: var(--radius); padding: 1rem 1.1rem 0.9rem; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.25rem 1rem; margin: 0 0 0.6rem; }
h2.title { margin: 0; font-size: 1.25rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.024em; text-wrap: balance; }
.hint { margin: 0 0 0.6rem; color: var(--label-2); font-size: 0.8125rem; letter-spacing: -0.004em; }
.section-head .hint { margin: 0; }

.chart { width: 100%; overflow-x: auto; overscroll-behavior-x: contain; border-radius: 8px; }
.chart svg { display: block; width: 100%; height: auto; }
#fan svg { touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
.chart text { fill: var(--label-2); font: 500 11px var(--font); letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.chart text.hol { fill: var(--orange); }
.chart text.sel { fill: var(--blue); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; margin-top: 0.6rem; color: var(--label-2); font-size: 0.75rem; letter-spacing: 0; }
.legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
.sw { width: 0.9rem; height: 0.55rem; border-radius: 99px; display: inline-block; }
.sw.line { height: 3px; }
.sw.dot { width: 0.55rem; }

.day-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 880px) { .day-grid { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 1.25rem; min-width: 0; }

/* Inset grouped lists, the way Settings groups related rows. */
.group-label { margin: 0 0 0.4rem 1rem; color: var(--label-2); font-size: 0.8125rem; letter-spacing: -0.004em; }
.list { background: var(--card); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.15rem 0.75rem; align-items: center; padding: 0.7rem 1rem; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 1rem; right: 0; height: 1px; background: var(--sep); transform: scaleY(0.5); transform-origin: top; }
.row .k { font-size: 0.9375rem; letter-spacing: -0.016em; min-width: 0; }
.row .v { font-size: 0.9375rem; color: var(--label-2); letter-spacing: -0.016em; text-align: right; }
.row .v.up { color: var(--blue); font-weight: 600; }
.row .d { grid-column: 1 / -1; color: var(--label-2); font-size: 0.8125rem; letter-spacing: -0.004em; }
.row.empty .k { color: var(--label-2); font-size: 0.875rem; }

.row.shift { grid-template-columns: 7.5rem minmax(0, 1fr); white-space: nowrap; }
.row.shift .k { font-size: 0.875rem; }
.track { position: relative; height: 0.5rem; background: var(--fill); border-radius: 99px; }
.track i { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: var(--blue); }
.track.base i { background: var(--gray); }
.ppl { display: inline-block; min-width: 1.5em; margin-right: 0.4rem; padding: 0 0.35em; border-radius: 99px; background: var(--fill); font-size: 0.75rem; font-weight: 600; text-align: center; line-height: 1.45; }

.replay { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.replay > div { padding: 0.75rem 1rem; position: relative; min-width: 0; }
.replay > div + div::before { content: ""; position: absolute; left: 0; top: 0.75rem; bottom: 0.75rem; width: 1px; background: var(--sep); transform: scaleX(0.5); }
.replay .k { font-size: 0.75rem; color: var(--label-2); letter-spacing: 0; }
.replay .v { font-size: 1.375rem; font-weight: 600; letter-spacing: -0.022em; }
.replay .v.best { color: var(--green); }

.swap { animation: settle 0.22s ease-out; }
@keyframes settle { from { opacity: 0.35; } to { opacity: 1; } }

footer { color: var(--label-2); font-size: 0.8125rem; line-height: 1.5; display: grid; gap: 0.5rem; max-width: 72ch; letter-spacing: -0.004em; }
footer a { color: var(--blue); text-decoration: none; }
footer a:hover { text-decoration: underline; }

@media (max-width: 640px) {
  .wrap { padding-inline: 1rem; gap: 1.4rem; }
  .bar-inner { padding-inline: 1rem; }
  .controls, .seg, select { width: 100%; }
  .seg { min-width: 0; }
  .card { padding-inline: 0.85rem; }
  .replay .v { font-size: 1.125rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01s !important; }
  .swap { animation: none; }
}
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="bar-inner">
    <div class="ident"><b>Shift Board</b><span>Covercast</span></div>
    <div class="controls">
      <select id="store" aria-label="Restaurant"></select>
      <div class="seg" role="tablist" aria-label="View">
        <span class="thumb" id="thumb"></span>
        <button role="tab" id="seg-plan" aria-selected="true" type="button">Plan</button>
        <button role="tab" id="seg-real" aria-selected="false" type="button">What happened</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero" aria-live="polite">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="headline" id="headline"></h1>
    <p class="lede" id="lede"></p>
    <span class="chip" id="chip"></span>
  </section>

  <section class="card">
    <div class="section-head">
      <h2 class="title">Next 14 days</h2>
      <p class="hint">Press or drag across the chart to move between days.</p>
    </div>
    <div class="chart" id="fan" role="slider" tabindex="0" aria-label="Day" aria-valuemin="1" aria-valuemax="14"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--blue-faint)"></i>80% range</span>
      <span><i class="sw" style="background:var(--blue-soft)"></i>50% range</span>
      <span><i class="sw dot" style="background:var(--blue)"></i>model staffs to</span>
      <span><i class="sw line" style="background:var(--gray)"></i>padded 4-week average</span>
      <span id="lg-actual" hidden><i class="sw dot" style="background:var(--label)"></i>actual covers</span>
    </div>
  </section>

  <section class="day-grid">
    <div class="card">
      <div class="section-head"><h2 class="title" id="day-title"></h2></div>
      <p class="hint" id="day-hint"></p>
      <div class="chart" id="hourly"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--blue-soft)"></i>staff needed, 80% range</span>
        <span><i class="sw line" style="background:var(--blue)"></i>model roster</span>
        <span><i class="sw line" style="background:var(--gray)"></i>4-week-average roster</span>
        <span id="lg-need" hidden><i class="sw dot" style="background:var(--orange)"></i>actual need</span>
      </div>
    </div>
    <div class="stack">
      <div><p class="group-label">Model roster</p><div class="list" id="roster-model"></div></div>
      <div><p class="group-label">4-week-average roster</p><div class="list" id="roster-base"></div></div>
      <div><p class="group-label">Why the forecast moved</p><div class="list" id="reasons"></div></div>
      <div id="replay-wrap" hidden><p class="group-label" id="replay-label"></p><div class="list replay" id="replay"></div></div>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("data").textContent);
  const M = D.meta, HOURS = M.hours, NH = HOURS.length;
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  // ---- Springs ----------------------------------------------------------------
  // Apple-style parameters: response (seconds) and damping ratio, critically
  // damped throughout since nothing here is thrown. A retarget starts from the
  // presented value and keeps its velocity, so any motion can be interrupted
  // and redirected mid-flight. Reduced motion snaps straight to the target.
  const springs = [];
  let raf = 0, last = 0;
  function Spring(init, response = 0.38, damping = 1) {
    const a = [].concat(init);
    this.x = Float64Array.from(a); this.v = new Float64Array(a.length); this.t = Float64Array.from(a);
    this.k = Math.pow((2 * Math.PI) / response, 2); this.c = (4 * Math.PI * damping) / response;
    springs.push(this);
  }
  Spring.prototype.to = function (target) {
    const a = [].concat(target);
    if (a.length !== this.x.length) { this.x = Float64Array.from(a); this.v = new Float64Array(a.length); this.t = Float64Array.from(a); }
    else this.t.set(a);
    if (reduceMotion.matches) this.settle();
    wake();
  };
  Spring.prototype.settle = function () { this.x.set(this.t); this.v.fill(0); };
  Spring.prototype.step = function (dt) {
    let moving = false;
    for (let i = 0; i < this.x.length; i++) {
      const acc = -this.k * (this.x[i] - this.t[i]) - this.c * this.v[i];
      this.v[i] += acc * dt; this.x[i] += this.v[i] * dt;
      if (Math.abs(this.x[i] - this.t[i]) > 1e-3 || Math.abs(this.v[i]) > 1e-3) moving = true;
      else { this.x[i] = this.t[i]; this.v[i] = 0; }
    }
    return moving;
  };
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let moving = false;
    for (const s of springs) { let m = false; for (let i = 0; i < 4; i++) m = s.step(dt / 4); moving = moving || m; }
    draw();
    raf = moving ? requestAnimationFrame(tick) : 0;
  }

  // ---- State -------------------------------------------------------------------
  const state = { store: -1, day: 0, reveal: false };
  try {
    const s = JSON.parse(localStorage.getItem("covercast") || "{}");
    if (Number.isInteger(s.store)) state.store = s.store;
    if (Number.isInteger(s.day)) state.day = s.day;
  } catch (e) {}
  if (!(state.store >= 0 && state.store < D.stores.length)) {
    // Open on the restaurant where the model's rosters saved the most once replayed.
    // Every store is still one tap away in the picker, losses included.
    const saved = (st) => st.days.reduce((a, d) => a + (d.replay ? d.replay.baseline - d.replay.model : 0), 0);
    state.store = D.stores.reduce((best, st, i) => (saved(st) > saved(D.stores[best]) ? i : best), D.stores.length - 1);
  }
  const save = () => { try { localStorage.setItem("covercast", JSON.stringify({ store: state.store, day: state.day })); } catch (e) {} };
  const store = () => D.stores[state.store];

  const zeros = () => new Array(NH).fill(0);
  const reveal = new Spring(0, 0.42);
  const sel = new Spring(0, 0.32);
  const hv = { p10: new Spring(zeros()), p50: new Spring(zeros()), p90: new Spring(zeros()), fm: new Spring(zeros()),
               fb: new Spring(zeros()), real: new Spring(zeros()), top: new Spring(4) };

  // ---- Helpers -----------------------------------------------------------------
  const clock = (h) => String(h % 24).padStart(2, "0") + ":00";
  const money = (v) => "$" + Math.round(v).toLocaleString("en-US");
  const dateLabel = (iso, opts) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", opts || { weekday: "short", month: "short", day: "numeric" });
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const node = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  // Axis top and step on a 1-2-5 ladder so every label is a round number the chart reaches.
  function niceAxis(v, ticks) {
    const raw = Math.max(v, 1) / ticks, p = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 5, 10].map((m) => m * p).find((s) => s >= raw);
    return { top: Math.ceil(v / step) * step, step };
  }

  // ---- Store picker --------------------------------------------------------------
  const bands = [["Under 15 covers a day", 0, 15], ["15 to 30 a day", 15, 30], ["30 to 60 a day", 30, 60], ["Over 60 a day", 60, 1e9]];
  for (const [name, lo, hi] of bands) {
    const og = document.createElement("optgroup"); og.label = name;
    D.stores.forEach((s, i) => { if (s.typical >= lo && s.typical < hi) og.appendChild(new Option(`${s.id} · ${s.genre}`, i)); });
    if (og.children.length) $("store").appendChild(og);
  }

  // ---- Two-week chart: built per store, its moving parts updated per frame -------
  // Charts are drawn at their real on-screen width so 11px labels stay 11px.
  const F = { W: 900, H: 250, L: 36, R: 6, T: 10, B: 42 };
  let fan = null;
  function buildFan() {
    const days = store().days, n = days.length;
    F.W = Math.max(300, Math.round($("fan").clientWidth || 900));
    F.H = F.W < 560 ? 220 : 250;
    const compact = F.W < 640;
    const ax = niceAxis(Math.max(...days.map((d) => Math.max(d.q.p90, d.mean4_padded, d.actual || 0))) * 1.05, 4);
    const colW = (F.W - F.L - F.R) / n;
    const x = (i) => F.L + (i + 0.5) * colW, y = (v) => F.T + (F.H - F.T - F.B) * (1 - v / ax.top);
    const svg = el("svg", { viewBox: `0 0 ${F.W} ${F.H}`, role: "img", "aria-label": "Forecast covers for the next 14 days" });
    for (let v = 0; v <= ax.top + 1e-9; v += ax.step) {
      el("line", { x1: F.L, x2: F.W - F.R, y1: y(v), y2: y(v), stroke: css("--sep"), "stroke-width": 1 }, svg);
      el("text", { x: F.L - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = Math.round(v);
    }
    const capsule = el("rect", { y: F.T - 4, width: Math.max(4, colW - 4), height: F.H - F.T - F.B + 36, rx: Math.min(10, colW / 2 - 2), fill: css("--blue-faint") }, svg);
    const band = (lo, hi, fill) => el("polygon", {
      points: days.map((d, i) => `${x(i)},${y(d.q[hi])}`).concat(days.map((d, i) => `${x(i)},${y(d.q[lo])}`).reverse()).join(" "), fill }, svg);
    band("p10", "p90", css("--blue-faint"));
    band("p25", "p75", css("--blue-soft"));
    el("polyline", { points: days.map((d, i) => `${x(i)},${y(d.q.p50)}`).join(" "), fill: "none", stroke: css("--blue"), "stroke-width": 2, "stroke-linejoin": "round", opacity: 0.55 }, svg);
    el("polyline", { points: days.map((d, i) => `${x(i)},${y(d.mean4_padded)}`).join(" "), fill: "none", stroke: css("--gray"), "stroke-width": 1.75, "stroke-dasharray": "4 4", "stroke-linejoin": "round" }, svg);
    days.forEach((d, i) => el("circle", { cx: x(i), cy: y(d.staff_to), r: 4.5, fill: css("--blue"), stroke: css("--card"), "stroke-width": 2 }, svg));
    const actual = days.map((d, i) => d.actual == null ? null : el("circle", { cx: x(i), r: 4.5, fill: css("--label"), stroke: css("--card"), "stroke-width": 2, opacity: 0 }, svg));
    const labels = days.map((d, i) => {
      const t1 = el("text", { x: x(i), y: F.H - F.B + 18, "text-anchor": "middle" }, svg); t1.textContent = compact ? d.dow.slice(0, 2) : d.dow;
      const t2 = el("text", { x: x(i), y: F.H - F.B + 32, "text-anchor": "middle" }, svg);
      t2.textContent = compact ? String(+d.date.slice(8)) : d.date.slice(5).replace("-", "/");
      if (d.holiday) { t1.classList.add("hol"); t2.classList.add("hol"); }
      return [t1, t2];
    });
    fan = { svg, y, colW, capsule, actual, labels, days, n };
    $("fan").replaceChildren(svg);
    $("fan").setAttribute("aria-valuemax", n);
  }

  // Scrubbing: the selection follows the pointer from the instant it goes down.
  function dayAt(clientX) {
    const pt = fan.svg.createSVGPoint(); pt.x = clientX; pt.y = 0;
    const p = pt.matrixTransform(fan.svg.getScreenCTM().inverse());
    return Math.max(0, Math.min(fan.n - 1, Math.floor((p.x - F.L) / fan.colW)));
  }
  let scrubbing = false;
  $("fan").addEventListener("pointerdown", (e) => {
    if (!fan || e.button > 0) return;
    scrubbing = true; $("fan").setPointerCapture(e.pointerId); selectDay(dayAt(e.clientX));
  });
  $("fan").addEventListener("pointermove", (e) => { if (scrubbing) selectDay(dayAt(e.clientX)); });
  for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) $("fan").addEventListener(t, () => { scrubbing = false; });
  $("fan").addEventListener("keydown", (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowDown: -1, ArrowUp: 1 }[e.key];
    let to = null;
    if (step) to = state.day + step; else if (e.key === "Home") to = 0; else if (e.key === "End") to = fan.n - 1;
    if (to !== null) { e.preventDefault(); selectDay(Math.max(0, Math.min(fan.n - 1, to))); }
  });

  function markSelected() {
    fan.labels.forEach(([a, b], j) => { a.classList.toggle("sel", j === state.day); b.classList.toggle("sel", j === state.day); });
    const d = fan.days[state.day];
    $("fan").setAttribute("aria-valuenow", state.day + 1);
    $("fan").setAttribute("aria-valuetext", `${dateLabel(d.date)}, staff for ${Math.round(d.staff_to)} covers`);
  }
  function selectDay(i) {
    if (i === state.day) return;
    state.day = i; save();
    sel.to(i); markSelected(); renderDay();
  }

  // ---- Hourly chart: structure once, attributes per frame -------------------------
  const Hc = { W: 640, H: 250, L: 28, R: 6, T: 8, B: 28 };
  let hr = null;
  function buildHourly() {
    Hc.W = Math.max(300, Math.round($("hourly").clientWidth || 640));
    Hc.H = Hc.W < 520 ? 220 : 250;
    const every = Hc.W < 520 ? 3 : 2;
    const svg = el("svg", { viewBox: `0 0 ${Hc.W} ${Hc.H}`, role: "img", "aria-label": "Staff needed and scheduled by hour" });
    const grid = el("g", {}, svg);
    const xs = (i) => Hc.L + (i * (Hc.W - Hc.L - Hc.R)) / NH;
    const short = HOURS.map(() => el("rect", { fill: css("--orange-soft"), rx: 2, opacity: 0 }, svg));
    const bands = HOURS.map(() => el("rect", { fill: css("--blue-soft"), rx: 4 }, svg));
    const meds = HOURS.map(() => el("line", { stroke: css("--blue"), "stroke-width": 1.5, "stroke-linecap": "round" }, svg));
    const pm = el("path", { fill: "none", stroke: css("--blue"), "stroke-width": 2.5, "stroke-linejoin": "round" }, svg);
    const pb = el("path", { fill: "none", stroke: css("--gray"), "stroke-width": 2, "stroke-dasharray": "4 4", "stroke-linejoin": "round" }, svg);
    const dots = HOURS.map(() => el("circle", { r: 3.5, fill: css("--orange"), opacity: 0 }, svg));
    HOURS.forEach((h, i) => { if (i % every === 0) el("text", { x: xs(i), y: Hc.H - Hc.B + 18, "text-anchor": "middle" }, svg).textContent = clock(h); });
    hr = { grid, xs, short, bands, meds, pm, pb, dots, gridKey: "" };
    $("hourly").replaceChildren(svg);
  }
  function drawHourly() {
    const top = hv.top.x[0], r = reveal.x[0], xs = hr.xs, w = xs(1) - xs(0);
    const y = (v) => Hc.T + (Hc.H - Hc.T - Hc.B) * (1 - v / top);
    const tick = Math.max(1, niceAxis(hv.top.t[0], 5).step), key = `${top.toFixed(3)}|${tick}`;
    if (key !== hr.gridKey) {
      hr.gridKey = key; hr.grid.replaceChildren();
      for (let v = 0; v <= top + 1e-6; v += tick) {
        el("line", { x1: Hc.L, x2: Hc.W - Hc.R, y1: y(v), y2: y(v), stroke: css("--sep"), "stroke-width": 1 }, hr.grid);
        el("text", { x: Hc.L - 7, y: y(v) + 4, "text-anchor": "end" }, hr.grid).textContent = v;
      }
    }
    const p10 = hv.p10.x, p50 = hv.p50.x, p90 = hv.p90.x, fm = hv.fm.x, fb = hv.fb.x, real = hv.real.x;
    let dm = "", db = "";
    for (let i = 0; i < NH; i++) {
      const b = hr.bands[i], lo = Math.min(p10[i], p90[i]), hi = Math.max(p10[i], p90[i]);
      b.setAttribute("x", xs(i) + 2); b.setAttribute("width", w - 4);
      b.setAttribute("y", y(hi)); b.setAttribute("height", Math.max(0, y(lo) - y(hi)));
      const m = hr.meds[i];
      m.setAttribute("x1", xs(i) + 5); m.setAttribute("x2", xs(i + 1) - 5); m.setAttribute("y1", y(p50[i])); m.setAttribute("y2", y(p50[i]));
      m.setAttribute("opacity", hi - lo > 0.02 ? 0.55 : 0);
      dm += `${i ? "L" : "M"}${xs(i)},${y(fm[i])} L${xs(i + 1)},${y(fm[i])} `;
      db += `${i ? "L" : "M"}${xs(i)},${y(fb[i])} L${xs(i + 1)},${y(fb[i])} `;
      // Actual need grows out of the model's roster line as the reveal plays,
      // and any part it overshoots the roster by is the shortfall.
      const shown = fm[i] + (real[i] - fm[i]) * r, gap = Math.max(0, shown - fm[i]);
      const dot = hr.dots[i];
      dot.setAttribute("cx", xs(i) + w / 2); dot.setAttribute("cy", y(shown)); dot.setAttribute("opacity", real[i] > 0.01 ? r : 0);
      const sh = hr.short[i];
      sh.setAttribute("x", xs(i) + 1); sh.setAttribute("width", w - 2);
      sh.setAttribute("y", y(fm[i] + gap)); sh.setAttribute("height", Math.max(0, y(fm[i]) - y(fm[i] + gap))); sh.setAttribute("opacity", r);
    }
    hr.pm.setAttribute("d", dm); hr.pb.setAttribute("d", db);
  }

  // ---- Per-frame draw -------------------------------------------------------------
  function draw() {
    const r = reveal.x[0];
    $("thumb").style.transform = `translateX(${r * 100}%)`;
    if (fan) {
      fan.capsule.setAttribute("x", F.L + sel.x[0] * fan.colW + 2);
      fan.days.forEach((d, i) => {
        const c = fan.actual[i]; if (!c) return;
        // Each actual point slides out of the forecast median to where the day really landed.
        c.setAttribute("cy", fan.y(d.q.p50 + (d.actual - d.q.p50) * r));
        c.setAttribute("opacity", r);
      });
    }
    if (hr) drawHourly();
  }

  // ---- Text panels ------------------------------------------------------------------
  function renderHero() {
    const s = store(), days = s.days;
    $("eyebrow").textContent = `${s.id} · ${s.genre} · ${s.area} · about ${Math.round(s.typical)} covers a day`;
    $("chip").textContent = M.label;
    $("chip").classList.toggle("synthetic", M.label.startsWith("synthetic"));
    const h = $("headline");
    if (!state.reveal) {
      const hm = days.reduce((a, d) => a + d.schedule.model.hours, 0), hb = days.reduce((a, d) => a + d.schedule.baseline.hours, 0);
      const diff = Math.round(hb - hm);
      h.textContent = `${Math.round(hm)} staff-hours`;
      $("lede").textContent = `Planned for the two weeks after ${dateLabel(M.cutoff, { month: "long", day: "numeric" })}. `
        + (diff > 0 ? `That's ${diff} fewer than a padded four-week average would book, placed where the forecast expects the rush.`
           : diff < 0 ? `That's ${-diff} more than a padded four-week average would book, because the forecast expects a busier fortnight.`
           : `The same total as a padded four-week average, placed by the forecast instead.`);
      return;
    }
    const known = days.filter((d) => d.replay);
    const rm = known.reduce((a, d) => a + d.replay.model, 0), rb = known.reduce((a, d) => a + d.replay.baseline, 0), ro = known.reduce((a, d) => a + d.replay.oracle, 0);
    const saved = rb - rm;
    h.replaceChildren();
    if (saved >= 0.5) h.append(node("span", "pos", money(saved)), " saved");
    else if (saved <= -0.5) h.textContent = `${money(-saved)} more`;
    else h.textContent = "No difference";
    $("lede").textContent = `Labor plus short-staffing cost over ${known.length} open days: the model's rosters ${money(rm)}, the four-week average's ${money(rb)}. `
      + `Rosters built knowing exactly what would happen cost ${money(ro)}.`;
  }

  function rosterRows(target, shifts, cls) {
    const span = HOURS[NH - 1] + 1 - HOURS[0], box = $(target);
    if (!shifts.length) { const r = node("div", "row empty"); r.append(node("span", "k", "Nobody scheduled")); box.replaceChildren(r); return; }
    box.replaceChildren(...shifts.map((s) => {
      const r = node("div", "row shift"), k = node("span", "k");
      const p = node("span", "ppl", String(s.people));
      p.setAttribute("aria-label", `${s.people} ${s.people > 1 ? "people" : "person"}`);
      k.append(p, `${clock(s.start)}–${clock(s.end)}`);
      const t = node("span", "track" + (cls ? " " + cls : "")), bar = document.createElement("i");
      bar.style.left = ((s.start - HOURS[0]) / span) * 100 + "%";
      bar.style.width = ((s.end - s.start) / span) * 100 + "%";
      t.append(bar); r.append(k, t); return r;
    }));
  }

  function renderReplay() {
    const d = store().days[state.day];
    $("replay-wrap").hidden = !state.reveal;
    if (!state.reveal) return;
    const box = $("replay");
    if (!d.replay) {
      $("replay-label").textContent = "Replayed against the real day";
      const r = node("div", "row empty"); r.style.gridColumn = "1 / -1"; r.append(node("span", "k", "Closed, or no report for this day."));
      box.replaceChildren(r); return;
    }
    $("replay-label").textContent = `Replayed against the real day · ${d.actual} covers came in`;
    const winner = d.replay.model < d.replay.baseline ? "Model" : d.replay.baseline < d.replay.model ? "4-week avg" : null;
    box.replaceChildren(...[["Model", d.replay.model], ["4-week avg", d.replay.baseline], ["Perfect foresight", d.replay.oracle]].map(([k, v]) => {
      const c = node("div"); c.append(node("div", "k", k), node("div", "v" + (k === winner ? " best" : ""), money(v))); return c;
    }));
  }

  function renderDay() {
    const d = store().days[state.day];
    $("day-title").textContent = `${dateLabel(d.date, { weekday: "long", month: "long", day: "numeric" })}${d.holiday ? " · holiday" : ""}`;
    $("day-hint").textContent = `${d.h} day${d.h > 1 ? "s" : ""} ahead. Forecast ${Math.round(d.q.p50)} covers, 80% range ${Math.round(d.q.p10)}–${Math.round(d.q.p90)}. `
      + `The model staffs for ${Math.round(d.staff_to)}, its ${Math.round(M.critical_ratio * 100)}th percentile, because a short staff-hour costs ${M.under_multiplier}× an idle one. `
      + `The padded four-week average says ${Math.round(d.mean4_padded)}.`;
    rosterRows("roster-model", d.schedule.model.shifts, "");
    rosterRows("roster-base", d.schedule.baseline.shifts, "base");
    const reasons = d.reasons.length ? d.reasons : [{ label: "Nothing unusual", effect: 0, detail: "" }];
    $("reasons").replaceChildren(...reasons.map((x) => {
      const r = node("div", "row");
      r.append(node("span", "k", x.label),
        node("span", "v" + (x.effect > 0.05 ? " up" : ""), `${x.effect > 0 ? "+" : x.effect < 0 ? "−" : ""}${Math.abs(x.effect).toFixed(1)} covers`));
      if (x.detail) r.append(node("span", "d", x.detail));
      return r;
    }));
    renderReplay();
    // The hourly chart retargets from wherever it is right now, mid-motion or not.
    hv.p10.to(d.need.p10); hv.p50.to(d.need.p50); hv.p90.to(d.need.p90);
    hv.fm.to(d.schedule.model.floor); hv.fb.to(d.schedule.baseline.floor);
    hv.real.to(d.need_real || zeros());
    const peak = Math.max(...d.need.p90, ...d.schedule.model.floor, ...d.schedule.baseline.floor, ...(d.need_real || [0]));
    hv.top.to(niceAxis(Math.max(2, Math.ceil(peak + 0.5)), 5).top);
  }

  function setReveal(on) {
    if (on === state.reveal) return;
    state.reveal = on;
    $("seg-plan").setAttribute("aria-selected", String(!on));
    $("seg-real").setAttribute("aria-selected", String(on));
    $("lg-actual").hidden = !on; $("lg-need").hidden = !on;
    reveal.to(on ? 1 : 0);
    renderHero(); renderReplay();
  }

  function renderStore() {
    $("store").value = state.store;
    state.day = Math.min(state.day, store().days.length - 1);
    buildFan();
    $("fan").classList.remove("swap"); void $("fan").offsetWidth; $("fan").classList.add("swap");
    sel.to(state.day); sel.settle();
    markSelected(); renderHero(); renderDay(); draw();
  }

  // ---- Wiring --------------------------------------------------------------------------
  $("store").addEventListener("change", (e) => { state.store = +e.target.value; save(); renderStore(); });
  // A segmented control commits on press. Keyboard activation arrives as a click with no pointer.
  $("seg-plan").addEventListener("pointerdown", () => setReveal(false));
  $("seg-real").addEventListener("pointerdown", () => setReveal(true));
  $("seg-plan").addEventListener("click", () => setReveal(false));
  $("seg-real").addEventListener("click", () => setReveal(true));
  const onScroll = () => $("bar").classList.toggle("scrolled", window.scrollY > 4);
  addEventListener("scroll", onScroll, { passive: true }); onScroll();
  // SVG colors are read from the tokens, so rebuild the charts when the theme flips.
  const retheme = () => { buildFan(); buildHourly(); markSelected(); draw(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  let lastW = 0;
  new ResizeObserver(() => {
    const w = Math.round($("fan").clientWidth);
    if (fan && Math.abs(w - lastW) > 1) { lastW = w; retheme(); }
  }).observe($("fan"));
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  $("foot").innerHTML = `<span>Wage $${M.wage}/h, ${M.labor_minutes_per_cover} staff-minutes per cover, at least ${M.min_crew} person on the floor whenever the doors are open, shifts of 3–8 hours. A short staff-hour is charged at ${M.under_multiplier}× wage. These are assumptions, not measurements.</span>
    <span>The hourly pattern comes from when this restaurant's guests booked for, blended with its genre's pattern. Each “why” effect re-runs the model with one input set back to its usual value, so they're measured one at a time and don't add up exactly.</span>
    <span>Method, tests and full results: <a href="https://github.com/AnoopIbrampur/covercast" target="_blank" rel="noopener">github.com/AnoopIbrampur/covercast</a></span>`;

  buildHourly();
  renderStore();
  // First paint starts at rest on the opening day rather than growing from zero.
  springs.forEach((s) => s.settle());
  draw();
})();
</script>

</body>
</html>
